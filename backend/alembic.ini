[migrations]
script_location = migrations
mongodb_uri = mongodb://localhost:27017/physioverse

[logging]
default_handler = console

[loggers]
keys = root, migrations, mongo

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_migrations]
level = INFO
handlers =
qualname = migrations

[logger_mongo]
level = WARN
handlers =
qualname = mongo.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
